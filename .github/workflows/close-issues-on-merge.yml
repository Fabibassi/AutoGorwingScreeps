# Close linked GitHub issues when a PR merges (any merge path).
# Also dispatches Deploy: merges via GITHUB_TOKEN (Automerge) do not fire
# push-triggered workflows, so recovery PRs otherwise never reach Screeps.
name: Close issues on merge
on:
  pull_request_target:
    types: [closed]
jobs:
  close-linked-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
      actions: write
    steps:
      - name: Checkout base branch scripts
        uses: actions/checkout@v4

      - name: Close linked open issues
        env:
          GH_TOKEN: ${{ secrets.AGS_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/close-linked-issues.sh
          .github/scripts/close-linked-issues.sh \
            "${{ github.event.pull_request.number }}" \
            "${{ github.repository }}"

      - name: Deploy main to Screeps
        if: github.event.pull_request.base.ref == 'main'
        env:
          GH_TOKEN: ${{ secrets.AGS_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Dispatching Deploy Screeps for main (merge of PR #${{ github.event.pull_request.number }})"
          gh workflow run "Deploy Screeps" --repo "${{ github.repository }}" --ref main
