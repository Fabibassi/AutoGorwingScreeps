# Push to main deploys when the push is not made with GITHUB_TOKEN.
# Automerge merges use GITHUB_TOKEN and skip push triggers — Close issues on
# merge dispatches this workflow so those merges still reach Screeps.
name: Deploy Screeps
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy
        env:
          SCREEPS_TOKEN: ${{ secrets.SCREEPS_TOKEN }}
          SCREEPS_EMAIL: ${{ secrets.SCREEPS_EMAIL }}
          SCREEPS_PASSWORD: ${{ secrets.SCREEPS_PASSWORD }}
          SCREEPS_BRANCH: ${{ vars.SCREEPS_BRANCH }}
          SCREEPS_SHARD: ${{ vars.SCREEPS_SHARD }}
          # Empty = https://screeps.com (World). Set only if World proxy differs.
          SCREEPS_HOSTNAME: ${{ vars.SCREEPS_HOSTNAME }}
        run: npx tsx ops/deploy.ts
