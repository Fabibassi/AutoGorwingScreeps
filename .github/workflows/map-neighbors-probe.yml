name: Map Neighbors Probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dump map-stats and Memory.ags
        env:
          SCREEPS_TOKEN: ${{ secrets.SCREEPS_TOKEN }}
          SCREEPS_SHARD: ${{ vars.SCREEPS_SHARD }}
        run: |
          node <<'NODE'
          const token = process.env.SCREEPS_TOKEN;
          const shard = process.env.SCREEPS_SHARD || "shard3";
          if (!token) { console.error("missing SCREEPS_TOKEN"); process.exit(1); }
          const headers = { "Content-Type": "application/json", "X-Token": token, "X-Shard": shard };
          const center = "W21N35";
          const rooms = [];
          for (let dx = -3; dx <= 3; dx++) {
            for (let dy = -3; dy <= 3; dy++) {
              const m = center.match(/^W(\d+)N(\d+)$/);
              const x = Number(m[1]) + dx;
              const y = Number(m[2]) + dy;
              rooms.push(`W${x}N${y}`);
            }
          }
          async function post(url, body) {
            const res = await fetch(url, { method: "POST", headers, body: JSON.stringify(body) });
            const text = await res.text();
            if (!res.ok) throw new Error(`${url} ${res.status} ${text}`);
            return JSON.parse(text);
          }
          async function get(url) {
            const res = await fetch(url, { headers });
            const text = await res.text();
            if (!res.ok) throw new Error(`${url} ${res.status} ${text}`);
            return JSON.parse(text);
          }
          (async () => {
            const stats = await post("https://screeps.com/api/game/map-stats", { rooms, shard, statName: "owner0" });
            const claimed = [];
            for (const [room, info] of Object.entries(stats.stats || {})) {
              if (info && (info.own || info.owner || info.status === "normal")) {
                claimed.push({ room, ...info });
              }
            }
            // Enrich users
            const users = stats.users || {};
            console.log("===MAP_STATS_RAW===");
            console.log(JSON.stringify({ claimedRooms: Object.fromEntries(Object.entries(stats.stats||{}).filter(([k,v]) => v && (v.own || v.owner))), users, novice: stats.novice, respawnArea: stats.respawnArea }, null, 2));
            const memUrl = new URL("https://screeps.com/api/user/memory");
            memUrl.searchParams.set("path", "ags");
            memUrl.searchParams.set("shard", shard);
            const mem = await get(memUrl.toString());
            console.log("===MEMORY_AGS===");
            let data = mem.data;
            if (typeof data === "string" && data.startsWith("gz:")) {
              const zlib = require("zlib");
              data = JSON.parse(zlib.gunzipSync(Buffer.from(data.slice(3), "base64")).toString("utf8"));
            } else if (typeof data === "string") {
              try { data = JSON.parse(data); } catch {}
            }
            console.log(JSON.stringify(data, null, 2));
            const me = await get("https://screeps.com/api/auth/me");
            console.log("===AUTH_ME===");
            console.log(JSON.stringify({ username: me.username, gcl: me.gcl, gpl: me.gpl, badge: me.badge?.type, rooms: me.rooms }, null, 2));
            // room objects overview for claimed neighbors + self via room-overview if available
            for (const room of rooms) {
              const st = (stats.stats || {})[room];
              if (!st || !st.own) continue;
              try {
                const ov = await get(`https://screeps.com/api/game/room-overview?room=${room}&interval=8&shard=${shard}`);
                console.log(`===ROOM_OVERVIEW_${room}===`);
                console.log(JSON.stringify(ov, null, 2).slice(0, 4000));
              } catch (e) {
                console.log(`===ROOM_OVERVIEW_${room}_ERR===`, String(e.message || e));
              }
            }
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE
