name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Soft-lock mockup sim
        run: npx tsx ops/sim/softLock.ts --instance ci-softlock --port 22199 --ticks 80
      - name: Boot mockup sim
        run: npx tsx ops/sim/boot.ts --instance ci-boot --port 22198 --ticks 80
