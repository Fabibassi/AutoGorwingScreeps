# Runs from the base branch (main) workflow file, not the PR head.
name: Automerge
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
jobs:
  automerge:
    if: >
      contains(github.event.pull_request.labels.*.name, 'automerge') ||
      startsWith(github.event.pull_request.head.ref, 'cursor/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    steps:
      # Never checkout PR code here (pull_request_target).
      - name: Enable auto-merge after CI
        env:
          GH_TOKEN: ${{ secrets.AGS_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          N="${{ github.event.pull_request.number }}"
          SHA="${{ github.event.pull_request.head.sha }}"
          BRANCH="${{ github.event.pull_request.head.ref }}"
          REPO="${{ github.repository }}"

          echo "PR #$N head=$SHA branch=$BRANCH"
          echo "Waiting for CI ..."

          # gh api --jq does not support jq --arg; pipe JSON to jq instead.
          ci_state() {
            gh api "repos/${REPO}/actions/runs?per_page=30&event=pull_request" \
              | jq -r --arg sha "$SHA" --arg branch "$BRANCH" --argjson n "$N" '
                [
                  .workflow_runs[]
                  | select(.name == "CI")
                  | select(
                      .head_sha == $sha
                      or .head_branch == $branch
                      or ((.pull_requests // []) | map(.number) | index($n) != null)
                    )
                ]
                | first
                | if . == null then "missing"
                  elif .status != "completed" then .status
                  else (.conclusion // "unknown")
                  end
              '
          }

          for i in $(seq 1 90); do
            STATE="$(ci_state)"
            echo "[$i] CI: $STATE"
            case "$STATE" in
              success)
                break
                ;;
              failure|cancelled|timed_out|startup_failure|action_required)
                echo "CI failed ($STATE) — refusing automerge"
                exit 1
                ;;
              missing|queued|in_progress|waiting|pending|requested|waiting_for_completion)
                sleep 10
                ;;
              *)
                sleep 10
                ;;
            esac
            if [ "$i" -eq 90 ]; then
              echo "Timed out waiting for CI"
              gh pr merge "$N" --repo "$REPO" --auto --squash
              echo "Enabled --auto after timeout; GitHub will merge when requirements allow."
              exit 0
            fi
          done

          gh pr merge "$N" --repo "$REPO" --auto --squash
          echo "Auto-merge enabled for PR #$N"
