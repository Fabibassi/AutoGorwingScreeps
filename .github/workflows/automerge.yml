# Runs from the base branch (main) workflow file, not the PR head.
name: Automerge
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
concurrency:
  group: automerge-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  automerge:
    if: >
      contains(github.event.pull_request.labels.*.name, 'automerge') ||
      startsWith(github.event.pull_request.head.ref, 'cursor/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      checks: read
      statuses: read
    steps:
      - name: Checkout base branch scripts
        uses: actions/checkout@v4

      - name: Enable auto-merge after CI
        env:
          GH_TOKEN: ${{ secrets.AGS_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          N="${{ github.event.pull_request.number }}"
          SHA="${{ github.event.pull_request.head.sha }}"
          REPO="${{ github.repository }}"

          close_linked_if_merged() {
            PR_STATE="$(gh pr view "$N" --repo "$REPO" --json state,mergedAt)"
            if echo "$PR_STATE" | jq -e '.state == "MERGED" or (.mergedAt != null)' >/dev/null; then
              chmod +x .github/scripts/close-linked-issues.sh
              .github/scripts/close-linked-issues.sh "$N" "$REPO"
            else
              echo "PR #$N not merged yet — issue close deferred to close-issues-on-merge workflow."
            fi
          }

          echo "PR #$N head=$SHA"

          # Already merged or auto-merge already enabled → success (idempotent).
          PR_JSON="$(gh pr view "$N" --repo "$REPO" --json autoMergeRequest,state,mergedAt,mergeable,mergeStateStatus,isDraft)"
          echo "PR view: $PR_JSON"
          if echo "$PR_JSON" | jq -e '.state == "MERGED" or (.mergedAt != null)' >/dev/null; then
            echo "PR #$N is already merged — closing linked issues if needed."
            close_linked_if_merged
            exit 0
          fi
          if echo "$PR_JSON" | jq -e '.autoMergeRequest != null' >/dev/null; then
            echo "Auto-merge already enabled for PR #$N — nothing to do."
            exit 0
          fi

          # Fail fast on merge conflicts — CI may never appear as useful signal.
          STATE="$(echo "$PR_JSON" | jq -r '.mergeStateStatus + " draft=" + (.isDraft|tostring) + " mergeable=" + (.mergeable|tostring)')"
          echo "PR state: $STATE"
          if echo "$PR_JSON" | jq -r .mergeStateStatus | grep -qiE 'dirty|blocked'; then
            echo "PR has conflicts or is blocked — refusing automerge. Rebase/fix the PR first."
            exit 1
          fi

          gh pr ready "$N" --repo "$REPO" 2>/dev/null || true

          # ONLY wait for the CI job named "test".
          # Never wait on "automerge" (this job) — that deadlocks forever.
          ci_state() {
            gh api "repos/${REPO}/commits/${SHA}/check-runs" --jq '
              [
                .check_runs[]
                | select(.name == "test")
              ] as $ci
              | if ($ci | length) == 0 then "missing"
                elif [$ci[].status] | any(. != "completed") then "in_progress"
                elif [$ci[].conclusion] | all(. == "success" or . == "skipped" or . == "neutral") then "success"
                else "failure"
                end
            '
          }

          echo "Waiting for CI job 'test' (ignoring automerge checks) ..."
          for i in $(seq 1 60); do
            STATE="$(ci_state)"
            echo "[$i] CI test: $STATE"
            case "$STATE" in
              success) break ;;
              failure)
                echo "CI failed — refusing automerge"
                exit 1
                ;;
              missing|in_progress)
                sleep 10
                ;;
              *)
                sleep 10
                ;;
            esac
            if [ "$i" -eq 60 ]; then
              echo "Timed out: CI job 'test' never went green (missing or stuck)."
              echo "Dumping check-runs:"
              gh api "repos/${REPO}/commits/${SHA}/check-runs" --jq '.check_runs[] | {name,status,conclusion}' || true
              exit 1
            fi
          done

          # Re-check after CI wait — another concurrent run may have enabled merge.
          PR_JSON="$(gh pr view "$N" --repo "$REPO" --json autoMergeRequest,state,mergedAt)"
          if echo "$PR_JSON" | jq -e '.state == "MERGED" or (.mergedAt != null)' >/dev/null; then
            echo "PR #$N was merged while waiting — closing linked issues if needed."
            close_linked_if_merged
            exit 0
          fi
          if echo "$PR_JSON" | jq -e '.autoMergeRequest != null' >/dev/null; then
            echo "Auto-merge already enabled for PR #$N after CI — success."
            exit 0
          fi

          set +e
          MERGE_OUT="$(gh pr merge "$N" --repo "$REPO" --auto --squash 2>&1)"
          MERGE_RC=$?
          set -e
          echo "$MERGE_OUT"
          if [ "$MERGE_RC" -eq 0 ]; then
            echo "Auto-merge enabled for PR #$N"
            # --auto may only queue merge; close only if already merged, else closed-workflow covers it.
            close_linked_if_merged
            exit 0
          fi
          if echo "$MERGE_OUT" | grep -qiE 'Merge already in progress|already merged|Pull request is already merged|already enabled|auto.?merge.*(already|enabled)'; then
            echo "Merge/auto-merge already in progress or done — treating as success."
            close_linked_if_merged
            exit 0
          fi
          echo "gh pr merge failed with exit $MERGE_RC"
          exit "$MERGE_RC"
