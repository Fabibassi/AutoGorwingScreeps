# Runs from the base branch (main) workflow file, not the PR head.
name: Automerge
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
jobs:
  automerge:
    if: >
      contains(github.event.pull_request.labels.*.name, 'automerge') ||
      startsWith(github.event.pull_request.head.ref, 'cursor/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    steps:
      - name: Enable auto-merge after checks
        env:
          GH_TOKEN: ${{ secrets.AGS_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          N="${{ github.event.pull_request.number }}"
          SHA="${{ github.event.pull_request.head.sha }}"
          REPO="${{ github.repository }}"

          echo "PR #$N head=$SHA"

          # Draft PRs cannot merge; Cursor agents often open drafts.
          gh pr ready "$N" --repo "$REPO" 2>/dev/null || true

          # Prefer commit check-runs (reliable) over actions/runs?event= filters.
          ci_state() {
            gh api "repos/${REPO}/commits/${SHA}/check-runs" --jq '
              if (.total_count // (.check_runs|length)) == 0 then "missing"
              elif [.check_runs[].status] | any(. != "completed") then "in_progress"
              elif [.check_runs[].conclusion] | all(. == "success" or . == "skipped" or . == "neutral") then "success"
              else "failure"
              end
            '
          }

          echo "Waiting for check runs on commit ..."
          for i in $(seq 1 90); do
            STATE="$(ci_state)"
            echo "[$i] checks: $STATE"
            case "$STATE" in
              success) break ;;
              failure)
                echo "Checks failed — refusing automerge"
                gh api "repos/${REPO}/commits/${SHA}/check-runs" --jq '.check_runs[] | {name,status,conclusion}' || true
                exit 1
                ;;
              missing|in_progress)
                sleep 10
                ;;
              *)
                sleep 10
                ;;
            esac
            if [ "$i" -eq 90 ]; then
              echo "Timed out waiting for checks"
              exit 1
            fi
          done

          gh pr merge "$N" --repo "$REPO" --auto --squash
          echo "Auto-merge enabled for PR #$N"
