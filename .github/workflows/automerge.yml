# Runs from the base branch (main) workflow file, not the PR head —
# so automerge fixes apply immediately without updating open agent PRs.
name: Automerge
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
jobs:
  automerge:
    if: >
      contains(github.event.pull_request.labels.*.name, 'automerge') ||
      startsWith(github.event.pull_request.head.ref, 'cursor/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    steps:
      # Never checkout PR code here (pull_request_target). Only use gh + trusted secrets.
      # Avoid `gh pr checks` (GraphQL statusCheckRollup often blocked for GITHUB_TOKEN on private repos).
      - name: Enable auto-merge after CI
        env:
          GH_TOKEN: ${{ secrets.AGS_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          N="${{ github.event.pull_request.number }}"
          SHA="${{ github.event.pull_request.head.sha }}"
          REPO="${{ github.repository }}"
          echo "Waiting for CI workflow on $SHA ..."
          for i in $(seq 1 90); do
            CONCLUSION=$(gh api "repos/${REPO}/actions/runs?head_sha=${SHA}&per_page=30" \
              --jq '[.workflow_runs[] | select(.name=="CI")] | first | .conclusion // .status // "missing"')
            echo "[$i] CI: $CONCLUSION"
            case "$CONCLUSION" in
              success)
                break
                ;;
              failure|cancelled|timed_out)
                echo "CI failed ($CONCLUSION) — refusing automerge"
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
            if [ "$i" -eq 90 ]; then
              echo "Timed out waiting for CI"
              exit 1
            fi
          done
          gh pr merge "$N" --repo "$REPO" --auto --squash
          echo "Auto-merge enabled for PR #$N"
